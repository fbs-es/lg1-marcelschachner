name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, Tests (inkl. Testcontainers), Formatprüfung
        run: ./gradlew build
      - name: Testberichte hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: testberichte
          path: backend/build/reports/tests/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Der OpenAPI-Generator ist ein Java-Programm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: API-Client reproduzierbar aus openapi.json (ADR 0002)
        run: |
          npm run generate:api
          git diff --exit-code -- src/app/api
          test -z "$(git status --porcelain -- src/app/api)"
      - name: Tests
        run: npm test -- --watch=false
      - name: Build
        run: npm run build
