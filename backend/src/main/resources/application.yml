spring:
  application:
    name: bestellsystem
  config:
    # Lokale Zugangsdaten aus der .env im Repo-Wurzelverzeichnis (bootRun läuft in backend/)
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bestellsystem}
    username: ${DB_USER:bestellsystem}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  web:
    # Deutscher Shop: Validierungsmeldungen immer deutsch, unabhängig von Accept-Language
    locale: de
    locale-resolver: fixed
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

springdoc:
  writer-with-order-by-keys: true
  default-produces-media-type: application/json
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html

bestellsystem:
  zeitzone: Europe/Berlin
  zahlungsziel: 14d
  mahnintervall: 7d
  mahnlauf:
    # täglich 06:00 in bestellsystem.zeitzone; "-" schaltet den Lauf ab (D-20)
    cron: "0 0 6 * * *"
  mail:
    absender: ${MAIL_ABSENDER:shop@bestellsystem.local}
