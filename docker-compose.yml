services:
  mariadb:
    image: mariadb:11
    container_name: lg1-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: lg1
      MARIADB_USER: lg1
      MARIADB_PASSWORD: lg1
    ports:
      - "3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql

volumes:
  mariadb-data:
